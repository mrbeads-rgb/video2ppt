[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "video2ppt"
version = "0.1.0"
description = "Convert presentation and explainer videos into editable PowerPoint (.pptx) decks with hybrid inpainting or modular element reconstruction."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "httpx>=0.27",
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "pillow>=10.0",
    "pydantic>=2.7",
    "python-pptx>=1.0",
    "rapidocr-onnxruntime>=1.3",
    "rich>=13.7",
    "scipy>=1.11",
]

[project.optional-dependencies]
whisper = ["faster-whisper>=1.0"]
dev = ["pytest>=8.0"]

[project.scripts]
video2ppt = "video2ppt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
